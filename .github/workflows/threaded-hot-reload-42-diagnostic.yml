name: Threaded hot-reload 4.2 diagnostic

on:
  workflow_dispatch:

env:
  RETRY: ${{ github.workspace }}/.github/other/retry.sh

defaults:
  run:
    shell: bash

jobs:
  linux-4-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v6

      - name: "Install Godot"
        uses: ./.github/composite/godot-install
        with:
          artifact-name: godot-linux-4.2
          godot-binary: godot.linuxbsd.editor.dev.x86_64

      - name: "Install Rust"
        uses: ./.github/composite/rust

      - name: "Patch prebuilt version"
        run: .github/other/patch-prebuilt.sh 4.2

      - name: "Build and test hot-reload"
        working-directory: itest/hot-reload/godot
        run: ./run-test.sh api-4-2
